name: Build APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gerar Redx Painel APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Gerar Keystore de assinatura do APK
        run: |
          keytool -genkeypair -v \
            -keystore "${RUNNER_TEMP}/redx-release.jks" \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias lumyx \
            -storepass lumyx123456 \
            -keypass lumyx123456 \
            -dname "CN=Redx Painel, OU=Mobile, O=Veexdevs, L=Sao Paulo, ST=SP, C=BR"

      - name: Compilar e Verificar APK Assinado
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/redx-release.jks
          KEYSTORE_PASSWORD: lumyx123456
          KEY_ALIAS: lumyx
          KEY_PASSWORD: lumyx123456
        run: |
          gradle assembleRelease assembleDebug --no-daemon --stacktrace
          mkdir -p apk-output
          cp app/build/outputs/apk/release/app-release.apk apk-output/Redx-Painel.apk
          APKSIGNER=$(ls -1 "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -n 1)
          "${APKSIGNER}" verify --verbose apk-output/Redx-Painel.apk
          ls -lh apk-output/

      - name: Publicar APK nos Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Redx-Painel-APK
          path: apk-output/Redx-Painel.apk
          if-no-files-found: error

      - name: Publicar APK em Releases (branch main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.3.0
          name: Redx Painel APK
          body: |
            ## Redx Painel - APK Pronto para Instalar
            - Visual **Preto e Vermelho** com a nova logo **RX**
            - **Janela flutuante arrastável** sobre qualquer aplicativo
            - **Abrir e fechar** a janela pelo app (`Ativar Painel` / `Desativar Painel`), pelo painel (`✕` / `Fechar`) ou pela notificação
            - **Botão Esconder** (`—` / `Esconder`) que recolhe a janela na **bolinha flutuante RX** (também arrastável)
            - **Toque na bolinha RX** para a janela flutuante **aparecer novamente**
          files: apk-output/Redx-Painel.apk
          prerelease: false
